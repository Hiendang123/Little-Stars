<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Stars</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="halo" class="halo" aria-hidden="true"></div>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <canvas id="heart-canvas" aria-label="Interactive 360-degree 3D spiral galaxy with a beating pink particle heart at its center"></canvas>

  <div id="heart-text" class="heart-text" aria-label="Little Stars I, II, III">
    <div class="heart-text-line"><span class="star-dot">🔴</span><span class="star-label">Little Stars ✨</span></div>
    <div class="heart-text-line"><span class="star-dot">🔵</span><span class="star-label">Little Stars II ✨</span></div>
    <div class="heart-text-line"><span class="star-dot">🟡</span><span class="star-label">Little Stars III ✨</span></div>
  </div>

  <p id="caption" class="caption" hidden></p>
  <script src="script.js" defer></script>
</body>
</html>
